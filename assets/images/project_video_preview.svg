    <circle cx="600" cy="286" r="151" stroke-width="2"/>
    <circle cx="600" cy="286" r="98" stroke-width="2"/>
  </g>
  <g fill="#9adfff" fill-opacity=".72">
    <circle cx="285" cy="184" r="3"/><circle cx="401" cy="381" r="4"/>
    <circle cx="792" cy="166" r="3"/><circle cx="879" cy="357" r="4"/>
    <circle cx="510" cy="104" r="3"/><circle cx="706" cy="442" r="3"/>
  </g>
  <text x="600" y="226" fill="#d9f5ff" fill-opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="6" text-anchor="middle">SMART HOME CONTROLLER</text>
  <text x="600" y="375" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">PROJECT VIDEO</text>
  <circle cx="600" cy="294" r="45" fill="#f3fbff" fill-opacity=".95"/>
  <path d="M590 272v44l36-22z" fill="#087db1"/>
  <text x="600" y="421" fill="#b9d1e6" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Click to watch with playback controls</text>
  <g transform="translate(48 594)">
