<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Watch the Smart Home Controller project video</title>
  <desc id="description">A video player preview with a play button and playback controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a2b"/>
      <stop offset="0.55" stop-color="#102c48"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00b8ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#00b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="progress" x1="0" x2="1">
      <stop stop-color="#00d5ff"/>
      <stop offset="1" stop-color="#577cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#030912"/>
  <rect x="3" y="3" width="1194" height="669" rx="26" fill="url(#background)" stroke="#6c94b8" stroke-opacity=".38" stroke-width="2"/>
  <ellipse cx="600" cy="295" rx="410" ry="300" fill="url(#glow)"/>
  <g fill="none" stroke="#38c9ff" stroke-opacity=".22">
