allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Force specific library versions to avoid dependency conflicts
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
        }
    }
}

// Minimalist namespace fix for legacy plugins (AGP 8.0+ support)
subprojects {
    project.plugins.whenPluginAdded { plugin ->
        if ("com.android.build.gradle.LibraryPlugin".equals(plugin.class.name) || 
            "com.android.build.gradle.AppPlugin".equals(plugin.class.name)) {
            project.android {
                if (namespace == null) {
                    namespace = project.group.toString().replace('-', '.')
                    if (namespace == "") {
                        namespace = "com.generated.plugin.${project.name.replace('_', '.')}"
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
